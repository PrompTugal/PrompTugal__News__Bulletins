name: Pages
# From the site repositories made by sites@AgentiCCells.dinis (2026-11-16). In the
# template itself (.factory-template exists) nothing is deployed: it is built,
# checked and versioned only. A seeded site deploys on every push to dev.
on:
  push:
    branches: [dev]
  workflow_dispatch:
permissions:
  contents: read
  actions: read # to read this workflow's last successful push run on dev, the trusted anchor A (security@, 14:26)
concurrency:
  group: pages
  cancel-in-progress: false
env:
  # Major and minor are set here by a person. The patch number is set by this workflow only:
  # the first release is v0.1.0, and each later push to dev adds one.
  VERSION_BASE: '0.1'
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      deploy: ${{ steps.mode.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: No release during a hold
        run: if [ -e board/HOLD.md ]; then echo "board/HOLD.md exists" >&2; exit 1; fi
      - id: version
        name: Work out the next version from the tags
        run: |
          last=$(git tag --list "v${VERSION_BASE}.*" | sed "s/^v${VERSION_BASE}\.//" | grep -E '^[0-9]+$' | sort -n | tail -1 || true)
          if [ -z "$last" ]; then next=0; else next=$((last + 1)); fi
          echo "version=v${VERSION_BASE}.${next}" >> "$GITHUB_OUTPUT"
          echo "Version: v${VERSION_BASE}.${next}"
      - id: mode
        name: Deploy unless this is the template itself
        run: if [ -e .factory-template ]; then echo deploy=false >> "$GITHUB_OUTPUT"; else echo deploy=true >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The signature check's own tests (throwaway repository and keys)
        run: node scripts/test-check-signatures.mjs
      - name: Control 10's own tests (no symlinks; throwaway repositories)
        run: node scripts/test-check-symlinks.mjs
      - run: node scripts/build.mjs
        env:
          SITE_VERSION: ${{ steps.version.outputs.version }}
      - run: node scripts/validate.mjs
      - name: The leak scan's key rules (tests)
        run: node scripts/test-leak-scan.mjs
      - if: steps.mode.outputs.deploy == 'true'
        uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  # Control 9 (security@'s fifth ruling, 19 Nov 14:20): the signature, trailer and leak checks run in their own job,
  # which runs no pushed code. It checks out the pushed commits as data, takes each checker from A (the newest commit a
  # passing run verified: the head of this workflow's latest successful push run on dev, read from GitHub's API, never
  # from git, a tag or a deployment), and reads the built site only as data (the Pages artifact). Deploy and tag need it. A GITHUB_ENV or
  # GITHUB_PATH written by a pushed build step stays in the build job and cannot reach this one.
  checks:
    needs: build
    # Only for dev (live.b@'s finding): a manual run on another branch never reaches checks, deploy or tag.
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    env:
      GIT_NO_REPLACE_OBJECTS: '1'
      NODE_OPTIONS: ''
      # Pushed attributes off, index included (events.b@'s finding): attributes come from the empty tree only (git 2.42+).
      GIT_ATTR_SOURCE: 4b825dc642cb6eb9a060e54bf8d69288fbee4904
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.attributesFile
      GIT_CONFIG_VALUE_0: /dev/null
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The built site, as data
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/pages-artifact
      - name: The security checks, from the last verified commit A (controls 1 to 10)
        env:
          AFTER: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          v=$(git version | sed -E 's/^git version ([0-9]+)\.([0-9]+).*/\1 \2/'); set -- $v
          { [ "$1" -gt 2 ] || { [ "$1" -eq 2 ] && [ "$2" -ge 42 ]; }; } || { echo "git $1.$2 is older than 2.42: GIT_ATTR_SOURCE would be ignored" >&2; exit 1; }
          test "$(git rev-parse --is-shallow-repository)" = false || { echo "a shallow clone (control 6)" >&2; exit 1; }
          # The pushed tree may not steer where this job writes (live.b@'s finding): no tracked _site, no symlinked
          # scripts/ or _site, and every pushed .gitattributes removed before any git command reads files.
          if [ -n "$(git ls-files -- _site | head -1)" ]; then echo "the pushed tree holds a _site path" >&2; exit 1; fi
          if [ -L scripts ] || [ ! -d scripts ] || [ -L _site ] || [ -e scripts/leak-scan.trusted.mjs ]; then echo "scripts/ or _site is a symlink, or a trusted path is already taken" >&2; exit 1; fi
          find . -path ./.git -prune -o -name .gitattributes -type f -print -exec rm -f {} +
          NODE="$(command -v node)"; case "$NODE" in /*) ;; *) echo "node is not an absolute path" >&2; exit 1;; esac
          # A (security@'s sixth ruling, 14:26): the head of this workflow's latest successful push run on dev. Only
          # GitHub Actions creates runs; anyone with write access could create a "successful deployment".
          # A = the head of the latest successful push run on dev in which the job named "checks" itself passed
          # (live.b@'s finding: a pushed workflow without this job could otherwise become the anchor).
          # Key bootstrap (PrompTugal__IaC policy/key-bootstrap.json): while the IaC App has set SIG_BOOTSTRAP_ANCHOR, it is A.
          if [ -n "${{ vars.SIG_BOOTSTRAP_ANCHOR }}" ]; then A="${{ vars.SIG_BOOTSTRAP_ANCHOR }}"; echo "anchor set by PrompTugal__IaC: $A"; else
            A=""
            for run in $(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/pages.yml/runs?branch=dev&event=push&status=success&per_page=20" \
                --jq '.workflow_runs[] | select(.path == ".github/workflows/pages.yml" and .head_branch == "dev" and .event == "push" and .conclusion == "success") | "\(.id):\(.head_sha)"'); do
              if [ "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/${run%%:*}/jobs?per_page=50" --jq '[.jobs[] | select(.name == "checks" and .conclusion == "success")] | length')" = 1 ]; then A="${run#*:}"; break; fi
            done
          fi
          echo "$A" | grep -Eq '^[0-9a-f]{40}$' || { echo "no verified anchor A (no successful push run of this workflow on dev)" >&2; exit 1; }
          git merge-base --is-ancestor "$A" "$AFTER" || { echo "A ($A) is not an ancestor of AFTER: a force push" >&2; exit 1; }
          for c in leak-scan check-commits check-signatures; do
            mode=$(git ls-tree "$A" "scripts/$c.mjs" | cut -d' ' -f1)
            case "$mode" in 100644|100755) ;; *) echo "scripts/$c.mjs in A is missing or not a regular file (mode ${mode:-none})" >&2; exit 1;; esac
          done
          # The built site first, before any trusted copy exists (events.b@'s finding): the archive's listing is vetted
          # (plain files and directories only, no absolute path, no ..), it is unpacked, then no symlink may remain.
          tar -tvf "$RUNNER_TEMP/pages-artifact/artifact.tar" > "$RUNNER_TEMP/listing.txt"
          if grep -Ev '^[-d]' "$RUNNER_TEMP/listing.txt" | grep -q .; then echo "the site archive holds something other than files and directories" >&2; exit 1; fi
          if tar -tf "$RUNNER_TEMP/pages-artifact/artifact.tar" | grep -Eq '^/|(^|/)\.\.(/|$)'; then echo "the site archive holds an absolute or .. path" >&2; exit 1; fi
          # Unpacked in RUNNER_TEMP, vetted there, then moved into place.
          mkdir "$RUNNER_TEMP/site"
          tar -xf "$RUNNER_TEMP/pages-artifact/artifact.tar" -C "$RUNNER_TEMP/site" --no-same-owner --no-same-permissions
          if [ -n "$(find "$RUNNER_TEMP/site" -type l | head -1)" ]; then echo "a symlink in the site" >&2; exit 1; fi
          rm -rf _site; mv "$RUNNER_TEMP/site" _site
          # Control 10, no symlinks (security@ ed70bd996; events.b@ 44d5402; library.b@ LIB-2026-069): A's checker and A's
          # exceptions (path and target, each with a reason) read every commit of A..AFTER (merges too), AFTER's tree,
          # the checkout and the site, NUL-separated and as bytes. Bootstrap: only while A is at or before bf0c2fc28639
          # (the last commit without the checker) is AFTER's copy used; any later A must carry it.
          if git cat-file -e "$A:scripts/check-symlinks.mjs" 2>/dev/null; then
            git cat-file blob "$A:scripts/check-symlinks.mjs" > "$RUNNER_TEMP/check-symlinks.mjs"
          elif git merge-base --is-ancestor "$A" bf0c2fc28639c0a6023c686a0316e3476fe22ade; then
            # Only the reviewed checker (its blob id, pinned here) may bootstrap: a neutered copy is refused.
            test "$(git rev-parse "$AFTER:scripts/check-symlinks.mjs")" = 5001415bc3284f9f49fbdd07a954fbc8b07e2e49 || { echo "control 10 bootstrap: AFTER's checker is not the reviewed one" >&2; exit 1; }
            echo "control 10 bootstrap: A predates the checker, so this run uses the reviewed copy from AFTER"
            git cat-file blob "$AFTER:scripts/check-symlinks.mjs" > "$RUNNER_TEMP/check-symlinks.mjs"
          else
            echo "scripts/check-symlinks.mjs is missing from A (control 10)" >&2; exit 1
          fi
          ex=()
          if git cat-file -e "$A:scripts/symlink-exceptions.json" 2>/dev/null; then
            git cat-file blob "$A:scripts/symlink-exceptions.json" > "$RUNNER_TEMP/symlink-exceptions.json"
            ex=(--exceptions "$RUNNER_TEMP/symlink-exceptions.json")
          fi
          "$NODE" "$RUNNER_TEMP/check-symlinks.mjs" "$A" "$AFTER" ${ex[@]+"${ex[@]}"} --site _site
          # Every config the checks read comes from A too (signals.b@'s finding): A's commit-exemptions.json, or none.
          rm -f scripts/commit-exemptions.json
          if git cat-file -e "$A:scripts/commit-exemptions.json" 2>/dev/null; then git cat-file blob "$A:scripts/commit-exemptions.json" > scripts/commit-exemptions.json; fi
          git cat-file blob "$A:scripts/check-commits.mjs" > "$RUNNER_TEMP/check-commits.mjs"
          git cat-file blob "$A:scripts/check-signatures.mjs" > "$RUNNER_TEMP/check-signatures.mjs"
          "$NODE" "$RUNNER_TEMP/check-commits.mjs" "$A" "$AFTER"
          "$NODE" "$RUNNER_TEMP/check-signatures.mjs" "$A" "$AFTER"
          # The leak scan finds the repository from its own path, so A's copy is placed beside the scripts it scans
          # (scripts/leak-scan.trusted.mjs, git-ignored); it is A's code, not the pushed tree's. It scans the same
          # artifact the deploy job deploys (library.b@'s finding: the deployed bytes are the scanned bytes).
          git cat-file blob "$A:scripts/leak-scan.mjs" > scripts/leak-scan.trusted.mjs
          "$NODE" scripts/leak-scan.trusted.mjs
  deploy:
    needs: [build, checks]
    if: github.ref == 'refs/heads/dev' && needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  tag:
    needs: [build, checks, deploy]
    if: ${{ always() && github.ref == 'refs/heads/dev' && needs.build.result == 'success' && needs.checks.result == 'success' && (needs.deploy.result == 'success' || needs.deploy.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag the released commit
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          git tag "$VERSION" "$GITHUB_SHA"
          git push origin "$VERSION"
