name: Pages
# From the site repositories made by sites@AgentiCCells.dinis (2026-11-16). In the
# template itself (.factory-template exists) nothing is deployed: it is built,
# checked and versioned only. A seeded site deploys on every push to dev.
on:
  push:
    branches: [dev]
  workflow_dispatch:
permissions:
  contents: read
  deployments: read # to read the last successful github-pages deployment, the trusted anchor A (security@, 14:17)
concurrency:
  group: pages
  cancel-in-progress: false
env:
  # Major and minor are set here by a person. The patch number is set by this workflow only:
  # the first release is v0.1.0, and each later push to dev adds one.
  VERSION_BASE: '0.1'
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      deploy: ${{ steps.mode.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: No release during a hold
        run: if [ -e board/HOLD.md ]; then echo "board/HOLD.md exists" >&2; exit 1; fi
      - id: version
        name: Work out the next version from the tags
        run: |
          last=$(git tag --list "v${VERSION_BASE}.*" | sed "s/^v${VERSION_BASE}\.//" | grep -E '^[0-9]+$' | sort -n | tail -1 || true)
          if [ -z "$last" ]; then next=0; else next=$((last + 1)); fi
          echo "version=v${VERSION_BASE}.${next}" >> "$GITHUB_OUTPUT"
          echo "Version: v${VERSION_BASE}.${next}"
      - id: mode
        name: Deploy unless this is the template itself
        run: if [ -e .factory-template ]; then echo deploy=false >> "$GITHUB_OUTPUT"; else echo deploy=true >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Not a shallow clone (security@, control 6)
        run: test "$(git rev-parse --is-shallow-repository)" = false
      - name: The security checks, from the last verified commit A (controls 7 and 8; security@'s ruling of 14:17)
        # A is the newest commit a passing run verified: the sha of the last successful github-pages deployment, from
        # GitHub's own record (deployments API, read with this run's token), which a pusher cannot write. Tags are not
        # used. The run fails if A is missing or not an ancestor of AFTER. The range checked is A..AFTER, so commits of
        # a dropped run are covered, and every check runs from A's tree, never from the pushed tree.
        env:
          AFTER: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          A=""
          for id in $(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=github-pages&per_page=50" --jq '.[].id'); do
            if [ "$(gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses?per_page=1" --jq '.[0].state')" = success ]; then
              A=$(gh api "repos/$GITHUB_REPOSITORY/deployments/$id" --jq .sha); break
            fi
          done
          echo "$A" | grep -Eq '^[0-9a-f]{40}$' || { echo "no verified anchor A (no successful github-pages deployment found)" >&2; exit 1; }
          git merge-base --is-ancestor "$A" "$AFTER" || { echo "A ($A) is not an ancestor of AFTER: a force push" >&2; exit 1; }
          for c in leak-scan check-commits check-signatures; do git show "$A:scripts/$c.mjs" > "scripts/$c.trusted.mjs"; done
          node scripts/check-commits.trusted.mjs "$A" "$AFTER"
          node scripts/check-signatures.trusted.mjs "$A" "$AFTER"
      - name: The signature check's own tests (throwaway repository and keys)
        run: node scripts/test-check-signatures.mjs
      - run: node scripts/build.mjs
        env:
          SITE_VERSION: ${{ steps.version.outputs.version }}
      - run: node scripts/validate.mjs
      - name: The leak scan's key rules (tests)
        run: node scripts/test-leak-scan.mjs
      - name: Leak scan (tracked files and the built site), from the last release's copy
        run: node scripts/leak-scan.trusted.mjs
      - if: steps.mode.outputs.deploy == 'true'
        uses: actions/configure-pages@v5
      - if: steps.mode.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  tag:
    needs: [build, deploy]
    if: ${{ always() && needs.build.result == 'success' && (needs.deploy.result == 'success' || needs.deploy.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag the released commit
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          git tag "$VERSION" "$GITHUB_SHA"
          git push origin "$VERSION"
