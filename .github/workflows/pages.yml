name: Pages
# From the site repositories made by sites@AgentiCCells.dinis (2026-11-16). In the
# template itself (.factory-template exists) nothing is deployed: it is built,
# checked and versioned only. A seeded site deploys on every push to dev.
on:
  push:
    branches: [dev]
  workflow_dispatch:
permissions:
  contents: read
  actions: read # to read this workflow's last successful push run on dev, the trusted anchor A (security@, 14:26)
concurrency:
  group: pages
  cancel-in-progress: false
env:
  # Major and minor are set here by a person. The patch number is set by this workflow only:
  # the first release is v0.1.0, and each later push to dev adds one.
  VERSION_BASE: '0.1'
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      deploy: ${{ steps.mode.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: No release during a hold
        run: if [ -e board/HOLD.md ]; then echo "board/HOLD.md exists" >&2; exit 1; fi
      - id: version
        name: Work out the next version from the tags
        run: |
          last=$(git tag --list "v${VERSION_BASE}.*" | sed "s/^v${VERSION_BASE}\.//" | grep -E '^[0-9]+$' | sort -n | tail -1 || true)
          if [ -z "$last" ]; then next=0; else next=$((last + 1)); fi
          echo "version=v${VERSION_BASE}.${next}" >> "$GITHUB_OUTPUT"
          echo "Version: v${VERSION_BASE}.${next}"
      - id: mode
        name: Deploy unless this is the template itself
        run: if [ -e .factory-template ]; then echo deploy=false >> "$GITHUB_OUTPUT"; else echo deploy=true >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The signature check's own tests (throwaway repository and keys)
        run: node scripts/test-check-signatures.mjs
      - run: node scripts/build.mjs
        env:
          SITE_VERSION: ${{ steps.version.outputs.version }}
      - run: node scripts/validate.mjs
      - name: The leak scan's key rules (tests)
        run: node scripts/test-leak-scan.mjs
      - if: steps.mode.outputs.deploy == 'true'
        uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  # Control 9 (security@'s fifth ruling, 19 Nov 14:20): the signature, trailer and leak checks run in their own job,
  # which runs no pushed code. It checks out the pushed commits as data, takes each checker from A (the newest commit a
  # passing run verified: the head of this workflow's latest successful push run on dev, read from GitHub's API, never
  # from git, a tag or a deployment), and reads the built site only as data (the Pages artifact). Deploy and tag need it. A GITHUB_ENV or
  # GITHUB_PATH written by a pushed build step stays in the build job and cannot reach this one.
  checks:
    needs: build
    runs-on: ubuntu-latest
    env:
      GIT_NO_REPLACE_OBJECTS: '1'
      NODE_OPTIONS: ''
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The built site, as data
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/pages-artifact
      - name: The security checks, from the last verified commit A (controls 1 to 9)
        env:
          AFTER: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse --is-shallow-repository)" = false || { echo "a shallow clone (control 6)" >&2; exit 1; }
          NODE="$(command -v node)"; case "$NODE" in /*) ;; *) echo "node is not an absolute path" >&2; exit 1;; esac
          # A (security@'s sixth ruling, 14:26): the head of this workflow's latest successful push run on dev. Only
          # GitHub Actions creates runs; anyone with write access could create a "successful deployment".
          A=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/pages.yml/runs?branch=dev&event=push&status=success&per_page=20" \
            --jq '[.workflow_runs[] | select(.path == ".github/workflows/pages.yml" and .head_branch == "dev" and .event == "push" and .conclusion == "success")][0].head_sha // ""')
          echo "$A" | grep -Eq '^[0-9a-f]{40}$' || { echo "no verified anchor A (no successful push run of this workflow on dev)" >&2; exit 1; }
          git merge-base --is-ancestor "$A" "$AFTER" || { echo "A ($A) is not an ancestor of AFTER: a force push" >&2; exit 1; }
          for c in leak-scan check-commits check-signatures; do
            mode=$(git ls-tree "$A" "scripts/$c.mjs" | cut -d' ' -f1)
            case "$mode" in 100644|100755) ;; *) echo "scripts/$c.mjs in A is missing or not a regular file (mode ${mode:-none})" >&2; exit 1;; esac
          done
          # The built site first, before any trusted copy exists (events.b@'s finding): the archive's listing is vetted
          # (plain files and directories only, no absolute path, no ..), it is unpacked, then no symlink may remain.
          rm -rf _site; mkdir _site
          tar -tvf "$RUNNER_TEMP/pages-artifact/artifact.tar" > "$RUNNER_TEMP/listing.txt"
          if grep -Ev '^[-d]' "$RUNNER_TEMP/listing.txt" | grep -q .; then echo "the site archive holds something other than files and directories" >&2; exit 1; fi
          if tar -tf "$RUNNER_TEMP/pages-artifact/artifact.tar" | grep -Eq '^/|(^|/)\.\.(/|$)'; then echo "the site archive holds an absolute or .. path" >&2; exit 1; fi
          tar -xf "$RUNNER_TEMP/pages-artifact/artifact.tar" -C _site --no-same-owner --no-same-permissions
          if [ -n "$(find _site -type l | head -1)" ]; then echo "a symlink in the site" >&2; exit 1; fi
          # Every config the checks read comes from A too (signals.b@'s finding): A's commit-exemptions.json, or none.
          rm -f scripts/commit-exemptions.json
          if git cat-file -e "$A:scripts/commit-exemptions.json" 2>/dev/null; then git show "$A:scripts/commit-exemptions.json" > scripts/commit-exemptions.json; fi
          git show "$A:scripts/check-commits.mjs" > "$RUNNER_TEMP/check-commits.mjs"
          git show "$A:scripts/check-signatures.mjs" > "$RUNNER_TEMP/check-signatures.mjs"
          "$NODE" "$RUNNER_TEMP/check-commits.mjs" "$A" "$AFTER"
          "$NODE" "$RUNNER_TEMP/check-signatures.mjs" "$A" "$AFTER"
          # The leak scan finds the repository from its own path, so A's copy is placed beside the scripts it scans
          # (scripts/leak-scan.trusted.mjs, git-ignored); it is A's code, not the pushed tree's. It scans the same
          # artifact the deploy job deploys (library.b@'s finding: the deployed bytes are the scanned bytes).
          git show "$A:scripts/leak-scan.mjs" > scripts/leak-scan.trusted.mjs
          "$NODE" scripts/leak-scan.trusted.mjs
  deploy:
    needs: [build, checks]
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  tag:
    needs: [build, checks, deploy]
    if: ${{ always() && needs.build.result == 'success' && needs.checks.result == 'success' && (needs.deploy.result == 'success' || needs.deploy.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag the released commit
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          git tag "$VERSION" "$GITHUB_SHA"
          git push origin "$VERSION"
