<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><title>Subtitles, the stage: PrompTugal.news Bulletins</title>
<meta name="description" content="The stage of the subtitles video: one synthetic presenter and eight caption styles, every frame a function of t. Made by agents from PrompTugal.news's data.">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<style>
*{box-sizing:border-box}body{margin:0;background:#000}
#frame{position:relative;width:1280px;height:720px;overflow:hidden;background:#0b1424;font-family:'DejaVu Sans',sans-serif;color:#fff}
#stage{position:absolute;inset:0}#cap{position:absolute;inset:0;pointer-events:none}
.chip{position:absolute;right:20px;top:16px;font:700 18px 'DejaVu Sans Mono',monospace;color:#000;background:#ffd84a;padding:4px 10px}
.foot{position:absolute;left:20px;bottom:12px;font:12px 'DejaVu Sans Mono',monospace;color:#9aabc4}
.title{position:absolute;left:0;right:0;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;padding:0 80px;background:rgba(7,13,24,.82)}
.title h1{font:700 64px/1.1 'DejaVu Sans',sans-serif;color:#ffd84a;margin:0 0 16px}.title p{font:28px/1.4 'DejaVu Sans',sans-serif;margin:0;color:#dfe7f2}
/* word states, shared */
.w{display:inline-block;white-space:pre}.w.next{color:rgba(255,255,255,.38)}.w.now{color:#fff}.w.done{color:#fff}.w.emph{font-weight:700}
/* 1 karaoke */
.karaoke{position:absolute;left:90px;right:90px;bottom:48px;text-align:center;font:700 40px/1.35 'DejaVu Sans',sans-serif;background:rgba(5,10,20,.78);border-radius:14px;padding:12px 20px}
.karaoke .line{margin:2px 0}.karaoke .line+.line{opacity:.55;font-size:32px}
.kfill{background:linear-gradient(90deg,#ffd84a var(--f),#fff var(--f));-webkit-background-clip:text;background-clip:text;color:transparent!important}
.kfill.next{background:linear-gradient(90deg,#fff 0,#fff 100%);-webkit-background-clip:text;background-clip:text}.kfill.done{background:#ffd84a;-webkit-background-clip:text;background-clip:text}
/* 2 one word */
.one{position:absolute;left:0;right:420px;top:0;bottom:0;display:grid;place-items:center}.one .big{font:800 120px/1 'DejaVu Sans',sans-serif;color:#fff;text-shadow:0 6px 24px rgba(0,0,0,.6)}.one .big.emph{color:#ffd84a}
/* 3 groups */
.groups{position:absolute;left:0;right:0;bottom:120px;text-align:center;font:700 58px/1.2 'DejaVu Sans',sans-serif}
.groups .w{background:#000c;padding:4px 14px;margin:0 2px;border-radius:8px}.groups .w.now{color:#ffd84a;transform:scale(1.12)}.groups .w.next{color:#fff;opacity:.55}
/* 4 rolling */
.rolling{position:absolute;left:180px;right:180px;bottom:40px;height:104px;overflow:hidden;background:#000;font:30px/52px 'DejaVu Sans Mono',monospace}
.rolling .roll{padding:0 18px}.rolling .line{white-space:nowrap;overflow:hidden;text-overflow:clip}.rl.next{color:rgba(255,255,255,.4)}.rl.now{color:#ffd84a}.rl.done{color:#fff}
/* 5 page */
.page{position:absolute;left:56px;top:70px;width:640px;bottom:70px;background:#f4f1e8;color:#1b2333;border-radius:6px;padding:36px 40px;box-shadow:0 10px 40px #0008}
.page .kick{font:700 16px 'DejaVu Sans Mono',monospace;color:#7a5b00;letter-spacing:.06em;text-transform:uppercase;margin-bottom:14px}
.page p{font:30px/1.55 'DejaVu Serif',serif;margin:0}.pg.next{color:#9aa3b2}.pg.now{color:#1b2333;background:#ffd84a;border-radius:4px}.pg.done{color:#1b2333}
/* 6 bubble */
.bubble{position:absolute;left:150px;top:96px;width:560px;background:#fff;color:#111;border-radius:28px;padding:26px 32px;font:700 38px/1.3 'DejaVu Sans',sans-serif;transform-origin:100% 100%}
.bubble::after{content:"";position:absolute;right:-34px;bottom:40px;border:22px solid transparent;border-left:40px solid #fff}.bubble .ghost{color:transparent}
/* 7 kinetic */
.kinetic{position:absolute;left:70px;top:150px;width:720px;font:500 34px/1.25 'DejaVu Sans',sans-serif}
.kinetic .kw{display:inline-block;margin:0 10px 12px 0;color:#fff;font-size:44px;font-weight:600;text-shadow:0 2px 10px #000}.kinetic .kw.emph{font:900 86px/1 'DejaVu Sans',sans-serif;color:#53d3ff;display:block}
/* 8 ticker */
.ticker .bar{position:absolute;left:0;right:0;bottom:56px;height:62px;background:#ffd84a;color:#000;display:flex;align-items:center;overflow:hidden;font:700 30px 'DejaVu Sans Mono',monospace}
.ticker .bar b{background:#000;color:#ffd84a;height:100%;display:grid;place-items:center;padding:0 18px;margin-right:18px}.ticker .bar span{white-space:nowrap}.tk.next{color:rgba(0,0,0,.4)}.tk.now,.tk.done{color:#000}
.ticker .said{position:absolute;right:20px;top:70px;width:380px;bottom:140px;margin:0;padding:16px 16px 16px 40px;background:rgba(0,0,0,.6);font:18px/1.4 'DejaVu Sans',sans-serif;color:#cfd8e6;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
.ticker .said li{margin-top:8px}
</style></head>
<body><div id="frame" data-presenters="../../lib/presenters/v0.1.1/presenters.js"><div id="stage"></div><div id="cap"></div><div class="chip" id="chip"></div><div class="foot" id="foot"></div></div>
<script src="captions.js"></script><script type="module" src="stage.js"></script></body></html>
